scoring:
  category_weights:
    valuation_score: 30
    asset_quality_score: 25
    balance_sheet_score: 15
    catalyst_score: 15
    analyst_sentiment_score: 15
    risk_penalty_max: -20

jurisdictions:
  preferred:
    - Canada
    - United States
    - Australia
    - Chile
  watch:
    - Argentina
    - South Africa
    - Mexico
    - Peru

memo:
  risk_focus:
    - commodity price sensitivity
    - reserve and resource quality
    - permitting and political risk
    - balance sheet and dilution risk
    - operating cost inflation
    - management execution

source_policy:
  request_delay_seconds: 2
  download_pdfs_by_default: false
  priority:
    tier_1:
      - annual reports
      - quarterly reports
      - NI 43-101 / JORC reports
      - feasibility studies
      - reserve/resource statements
      - investor presentations
      - company press releases
    tier_2:
      - exchange filings
      - regulator filings
      - analyst summaries if accessible
    tier_3:
      - financial news
      - blogs
      - forum posts
