name: Daily Real Asset Research Scan

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore historical research state
        uses: actions/cache@v4
        with:
          path: |
            data/research.db
            public/history
            reports/companies
          key: research-history-${{ github.run_id }}
          restore-keys: |
            research-history-

      - name: Run daily scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          FACTSET_API_KEY: ${{ secrets.FACTSET_API_KEY }}
          FACTSET_USERNAME: ${{ secrets.FACTSET_USERNAME }}
          FACTSET_PASSWORD: ${{ secrets.FACTSET_PASSWORD }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINANCIAL_MODELING_PREP_API_KEY: ${{ secrets.FINANCIAL_MODELING_PREP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          YFINANCE_ENABLED: ${{ vars.YFINANCE_ENABLED || 'true' }}
          GOOGLE_FINANCE_EXPERIMENTAL: ${{ vars.GOOGLE_FINANCE_EXPERIMENTAL || 'false' }}
          PIPELINE_MAX_COMPANIES_PER_RUN: ${{ vars.PIPELINE_MAX_COMPANIES_PER_RUN || '35' }}
          SOURCE_DISCOVER_PDF_LINKS: ${{ vars.SOURCE_DISCOVER_PDF_LINKS || 'false' }}
          SOURCE_DOWNLOAD_PDFS: ${{ vars.SOURCE_DOWNLOAD_PDFS || 'false' }}
          SOURCE_REQUEST_DELAY_SECONDS: ${{ vars.SOURCE_REQUEST_DELAY_SECONDS || '0.5' }}
          SOURCE_MAX_COMPANIES_PER_RUN: ${{ vars.SOURCE_MAX_COMPANIES_PER_RUN || '35' }}
          SOURCE_MAX_SEED_URLS_PER_COMPANY: ${{ vars.SOURCE_MAX_SEED_URLS_PER_COMPANY || '4' }}
          SOURCE_PDF_LINK_LIMIT_PER_SEED: ${{ vars.SOURCE_PDF_LINK_LIMIT_PER_SEED || '3' }}
          SOURCE_EXTRACT_REMOTE_HTML: ${{ vars.SOURCE_EXTRACT_REMOTE_HTML || 'false' }}
          EXTRACT_MAX_SOURCES_PER_RUN: ${{ vars.EXTRACT_MAX_SOURCES_PER_RUN || '60' }}
          EXTRACT_MAX_PAGES_PER_DOC: ${{ vars.EXTRACT_MAX_PAGES_PER_DOC || '8' }}
          DISCOVERY_ENABLE_LIVE_SOURCES: ${{ vars.DISCOVERY_ENABLE_LIVE_SOURCES || 'true' }}
          DISCOVERY_ENRICH_COMPANY_PROFILES: ${{ vars.DISCOVERY_ENRICH_COMPANY_PROFILES || 'true' }}
          DISCOVERY_USE_CURATED_FALLBACK: ${{ vars.DISCOVERY_USE_CURATED_FALLBACK || 'true' }}
          DISCOVERY_MAX_COMPANIES_PER_RUN: ${{ vars.DISCOVERY_MAX_COMPANIES_PER_RUN || '80' }}
          DISCOVERY_NEW_COMPANIES_PER_RUN: ${{ vars.DISCOVERY_NEW_COMPANIES_PER_RUN || '7' }}
          DISCOVERY_DAILY_NEW_COMPANY_LIMIT: ${{ vars.DISCOVERY_DAILY_NEW_COMPANY_LIMIT || '28' }}
          DISCOVERY_REMOTE_CSV_URLS: ${{ vars.DISCOVERY_REMOTE_CSV_URLS || '' }}
          DISCOVERY_EXTRA_COMPANIES_JSON: ${{ vars.DISCOVERY_EXTRA_COMPANIES_JSON || '' }}
          NEWS_DISCOVERY_ENABLED: ${{ vars.NEWS_DISCOVERY_ENABLED || 'true' }}
          NEWS_ITEMS_PER_COMPANY: ${{ vars.NEWS_ITEMS_PER_COMPANY || '3' }}
          NEWS_MAX_COMPANIES_PER_RUN: ${{ vars.NEWS_MAX_COMPANIES_PER_RUN || '35' }}
          NEWS_REQUEST_DELAY_SECONDS: ${{ vars.NEWS_REQUEST_DELAY_SECONDS || '0.5' }}
        run: python scripts/run_daily_scan.py

      - name: Build static portal
        run: python scripts/build_site.py

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-outputs
          path: |
            data/research.db
            outputs/latest_screen.csv
            outputs/latest_screen.json
            outputs/historical_scores.csv
            outputs/historical_scores.json
            public/data/metadata.json
            reports/*.md
            reports/companies/*.md
            public/
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
